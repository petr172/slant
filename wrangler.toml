#:schema node_modules/wrangler/config-schema.json
# Cloudflare Workers (static assets + SSR). Astro @astrojs/cloudflare vygeneruje
# dist/_worker.js/index.js (SSR entry) a dist/ se statickými assety.
name = "slant"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist"
